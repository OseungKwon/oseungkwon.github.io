<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>React가 부모 핸들러를 찾는 과정</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 8px 0;
        font: 16px/1.65 var(--embed-font, system-ui, sans-serif);
        color: var(--embed-text, #1e293b);
        background: transparent;
        --blue: #2563eb;
        --purple: #7c3aed;
        --line: #e2e8f0;
        --soft: #f8fafc;
        --muted: #64748b;
        --bt: #eff6ff;
        --pt: #f5f3ff;
      }
      .dark body {
        --blue: #93c5fd;
        --purple: #c4b5fd;
        --line: #404854;
        --soft: #202630;
        --muted: #a5b1c3;
        --bt: #1d3049;
        --pt: #302845;
      }
      button,
      select {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .top label {
        font-size: 14px;
      }
      .top select {
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
      }
      .steps {
        display: flex;
        gap: 20px;
        margin: 22px 0 18px;
        border-bottom: 1px solid var(--line);
      }
      .steps span {
        padding: 0 0 10px;
        font-size: 14px;
        color: var(--muted);
      }
      .steps .active {
        color: var(--blue);
        border-bottom: 2px solid var(--blue);
        font-weight: 700;
      }
      h2 {
        font-size: 22px;
        line-height: 1.4;
        margin: 0 0 8px;
        letter-spacing: -0.5px;
      }
      #explanation {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 15px;
      }
      .scene {
        display: grid;
        grid-template-columns: 1fr 32px 1fr;
        align-items: start;
        gap: 10px;
      }
      .caption {
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .parent {
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        position: relative;
      }
      .parent.current {
        border-color: var(--purple);
      }
      .tag {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        font-weight: 650;
      }
      .purple {
        color: var(--purple);
      }
      .blue {
        color: var(--blue);
      }
      code {
        font:
          13px/1.6 ui-monospace,
          monospace;
        overflow-wrap: anywhere;
      }
      .handler {
        font-size: 12px;
        margin: 6px 0 20px;
        color: var(--muted);
      }
      .target {
        border: 2px solid var(--blue);
        background: var(--bt);
        border-radius: 7px;
        padding: 10px 16px;
        display: block;
        width: 100%;
        color: var(--blue);
        font-weight: 700;
      }
      .target.current {
        box-shadow: 0 0 0 4px var(--bt);
      }
      .target small {
        display: block;
        font:
          12px/1.6 ui-monospace,
          monospace;
        font-weight: 400;
      }
      .pointer {
        font-size: 12px;
        text-align: center;
        color: var(--muted);
        margin-top: 10px;
      }
      .transfer {
        align-self: center;
        color: var(--muted);
        font-size: 24px;
        text-align: center;
      }
      .queue {
        display: grid;
        gap: 9px;
      }
      .entry {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--muted);
        font-size: 14px;
      }
      .entry.filled {
        border-style: solid;
      }
      .entry.child.filled {
        color: var(--blue);
        border-color: var(--blue);
        background: var(--bt);
      }
      .entry.parent-entry.filled {
        color: var(--purple);
        border-color: var(--purple);
        background: var(--pt);
      }
      .entry .tag {
        font-size: 14px;
      }
      .entry code {
        display: block;
        margin-top: 4px;
      }
      .entry small {
        font-size: 11px;
      }
      .result {
        margin-top: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
      }
      .result .caption {
        margin: 0;
      }
      .call {
        padding: 3px 10px;
        border-radius: 5px;
        background: var(--soft);
        font-weight: 650;
      }
      .code {
        margin-top: 18px;
        padding: 12px 14px;
        background: var(--soft);
        border-radius: 7px;
        border-left: 3px solid var(--blue);
      }
      .code span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 3px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
      }
      .controls button {
        padding: 8px 16px;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .controls #next {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
      }
      .dark .controls #next {
        color: #10233d;
      }
      .controls #reset {
        margin-left: auto;
        border: 0;
        color: var(--muted);
        padding: 8px 0;
        font-size: 13px;
      }
      .note {
        font-size: 12px;
        color: var(--muted);
        margin: 16px 0 0;
      }
      #count {
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 520px) {
        .scene {
          grid-template-columns: 1fr;
        }
        .transfer {
          transform: rotate(90deg);
          line-height: 1;
          margin: 4px;
        }
        .parent {
          padding: 14px;
        }
        .steps {
          gap: 14px;
        }
        h2 {
          font-size: 20px;
        }
        .controls {
          gap: 6px;
        }
        .controls button {
          padding: 8px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <strong>부모의 핸들러는 어떻게 실행될까</strong
      ><label
        >비교할 단계
        <select id="phase">
          <option value="bubble">버블 · onClick</option>
          <option value="capture">캡처 · onClickCapture</option>
        </select></label
      >
    </div>
    <div class="steps" aria-label="처리 순서">
      <span id="stage0">1. 타깃에서 찾기</span
      ><span id="stage1">2. 부모까지 수집</span
      ><span id="stage2">3. 순서대로 호출</span>
    </div>
    <h2 id="headline"></h2>
    <p id="explanation" aria-live="polite"></p>
    <div class="scene">
      <div>
        <p class="caption">두 요소 모두 핸들러를 가지고 있습니다.</p>
        <div class="parent" id="parent">
          <div class="tag purple">
            <span>부모 div</span><code>부모 Fiber</code>
          </div>
          <div class="handler" id="parentHandler"></div>
          <button class="target" id="target" type="button">
            삭제 버튼<small id="childHandler"></small>
          </button>
          <div class="pointer" id="pointer"></div>
        </div>
      </div>
      <div class="transfer" aria-hidden="true">→</div>
      <div>
        <p class="caption">React가 모은 핸들러 · listeners</p>
        <div class="queue">
          <div class="entry child" id="q0"></div>
          <div class="entry parent-entry" id="q1"></div>
        </div>
      </div>
    </div>
    <div class="result">
      <span class="caption">모형의 호출 순서</span>
      <div id="called"></div>
    </div>
    <div class="code"><span id="function"></span><code id="source"></code></div>
    <div class="controls">
      <button id="back" type="button">이전</button
      ><button id="next" type="button"></button><span id="count"></span
      ><button id="reset" type="button">처음으로</button>
    </div>
    <p class="note">
      React v19.2.0의 click 처리 설명용 모형입니다. 실제 React 실행 결과가
      아니며, 전파 중단이 없는 경우를 보여줍니다. 캡처와 버블은 각각 별도로
      처리됩니다.
    </p>
    <script>
      const $ = (s) => document.querySelector(s);
      let step = 0;
      function render() {
        const capture = $('#phase').value === 'capture',
          prop = capture ? 'onClickCapture' : 'onClick',
          order = capture ? ['parent', 'child'] : ['child', 'parent'];
        const states = [
          [
            '버튼에서 탐색을 시작합니다.',
            '삭제 버튼을 클릭하면 React는 이 버튼에 대응하는 Fiber에서 핸들러를 찾기 시작합니다.',
            'let instance = targetFiber;',
            '버튼 핸들러 찾기',
          ],
          [
            '버튼의 핸들러를 목록에 담았습니다.',
            `버튼의 ${prop}을 찾았습니다. listeners의 첫 번째 항목으로 추가합니다. 다음 단계에서는 부모로 이동합니다.`,
            'listeners.push(createDispatchListener(...));',
            '부모로 이동하기',
          ],
          [
            '부모 Fiber에도 핸들러가 있습니다.',
            `instance.return을 따라 부모 div에 도착했습니다. 이 요소의 ${prop}도 목록에 추가해야 합니다.`,
            'instance = instance.return;',
            '부모 핸들러 담기',
          ],
          [
            '부모 핸들러를 버튼 다음에 추가했습니다.',
            '부모 핸들러를 두 번째 칸에 넣었습니다. 이후 HostRoot를 거쳐 탐색을 끝내고, 합성 이벤트와 목록을 실행 큐에 넣습니다.',
            'dispatchQueue.push({event, listeners});',
            capture ? '부모부터 호출하기' : '버튼부터 호출하기',
          ],
          [
            capture
              ? '캡처에서는 부모 핸들러부터 호출합니다.'
              : '버블에서는 버튼 핸들러부터 호출합니다.',
            capture
              ? '수집 순서를 거꾸로 읽으므로 부모의 핸들러가 먼저 실행됩니다.'
              : '수집한 순서대로 읽으므로 버튼의 핸들러가 먼저 실행됩니다.',
            capture ? 'i = dispatchListeners.length - 1;' : 'i = 0;',
            capture ? '버튼 호출하기' : '부모 호출하기',
          ],
          [
            capture
              ? '부모 다음에 버튼 핸들러를 호출했습니다.'
              : '버튼 다음에 부모 핸들러를 호출했습니다.',
            capture
              ? '목록을 뒤에서부터 읽었기 때문에 부모, 버튼 순서로 실행되었습니다.'
              : 'React가 목록의 다음 항목을 읽어 부모 핸들러를 실행했습니다.',
            'executeDispatch(event, listener, currentTarget);',
            '호출 완료',
          ],
        ];
        const [headline, text, code, next] = states[step];
        $('#headline').textContent = headline;
        $('#explanation').textContent = text;
        $('#source').textContent = code;
        $('#function').textContent =
          step < 3
            ? 'accumulateSinglePhaseListeners'
            : step === 3
              ? 'SimpleEventPlugin.extractEvents'
              : 'processDispatchQueueItemsInOrder';
        $('#next').textContent = next;
        $('#next').disabled = step === 5;
        $('#back').disabled = step === 0;
        $('#count').textContent = `${step + 1} / 6`;
        for (let i = 0; i < 3; i++)
          $('#stage' + i).classList.toggle(
            'active',
            i === (step < 2 ? 0 : step < 4 ? 1 : 2),
          );
        $('#parentHandler').textContent = prop + ' = handleParent';
        $('#childHandler').textContent = prop + ' = handleDelete';
        $('#pointer').textContent =
          step < 2
            ? '현재 확인 중: 버튼 Fiber'
            : step < 4
              ? '현재 확인 중: 부모 Fiber'
              : '탐색 완료 · 목록에서 실행';
        $('#parent').classList.toggle('current', step === 2 || step === 3);
        $('#target').classList.toggle('current', step < 2);
        for (let i = 0; i < 2; i++) {
          const filled = step >= (i === 0 ? 1 : 3),
            node = i === 0 ? 'child' : 'parent',
            invoked = step === 5 || (step === 4 && order[0] === node),
            el = $('#q' + i);
          el.classList.toggle('filled', filled);
          el.replaceChildren();
          const label = document.createElement('div');
          label.className = 'tag';
          label.textContent = filled
            ? `${i}번 · ${i === 0 ? '버튼' : '부모'} 핸들러${invoked ? ' ✓ 호출됨' : ''}`
            : `${i}번 · 아직 비어 있습니다`;
          el.append(label);
          if (filled) {
            const c = document.createElement('code');
            c.textContent =
              i === 0 ? 'handleDelete(event)' : 'handleParent(event)';
            el.append(c);
          }
        }
        const called = step === 5 ? order : step === 4 ? [order[0]] : [];
        $('#called').replaceChildren();
        if (!called.length)
          $('#called').textContent = '아직 호출하지 않았습니다.';
        called.forEach((node, i) => {
          if (i) $('#called').append(' → ');
          const tag = document.createElement('span');
          tag.className = 'call ' + (node === 'child' ? 'blue' : 'purple');
          tag.textContent = node === 'child' ? '버튼' : '부모';
          $('#called').append(tag);
        });
      }
      $('#next').onclick = () => {
        if (step < 5) step++;
        render();
      };
      $('#back').onclick = () => {
        if (step > 0) step--;
        render();
      };
      $('#reset').onclick = () => {
        step = 0;
        render();
      };
      $('#target').onclick = () => {
        step = 0;
        render();
      };
      $('#phase').onchange = () => {
        step = 0;
        render();
      };
      render();
    </script>
  </body>
</html>
