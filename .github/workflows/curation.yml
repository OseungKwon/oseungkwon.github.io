name: Add curation from issue

# 큐레이션 이슈 폼(.github/ISSUE_TEMPLATE/curation.yml)으로 연 이슈를 항목 파일로 바꿔 Pull Request로 올린다.
# 이슈는 누구나 열 수 있지만, master에 반영하는 머지는 쓰기 권한이 있는 저장소 주인만 할 수 있다.
# 머지하면 그 push로 deploy.yml이 돌아 배포된다. 이슈 본문을 고치거나(edited) 닫았다 다시 열면(reopened)
# 같은 PR을 새 내용으로 갱신한다.
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

# 같은 이슈를 연달아 고치면 마지막 내용만 반영되도록 앞선 실행을 취소한다.
concurrency:
  group: curation-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  propose:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'curation')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ENTRY_BRANCH: curation/issue-${{ github.event.issue.number }}
      # runner 컨텍스트는 job 단위 env에서 쓸 수 없어 고정 경로를 쓴다.
      COMMENT_FILE: /tmp/curation-comment.md
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 이슈 본문은 셸에 끼워 넣지 않고 환경 변수로만 넘긴다.
      - name: Create entry from issue
        id: entry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: node scripts/curation/from-issue.mjs

      - name: Report invalid input
        if: steps.entry.outputs.status == 'invalid'
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$COMMENT_FILE"

      - name: Close duplicate
        if: steps.entry.outputs.status == 'duplicate'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$COMMENT_FILE"
          gh issue close "$ISSUE_NUMBER" --reason "not planned"

      # 스키마에 맞지 않는 항목은 PR로 올리기 전에 걸러 낸다.
      - name: Build to validate
        if: steps.entry.outputs.status == 'created'
        run: pnpm build

      # 이슈마다 브랜치 하나를 쓰고, 다시 실행되면 master 위에서 새로 만든 커밋으로 덮어쓴다.
      - name: Open or update pull request
        if: steps.entry.outputs.status == 'created'
        env:
          ENTRY_FILE: ${{ steps.entry.outputs.file }}
          ENTRY_TITLE: ${{ steps.entry.outputs.title }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$ENTRY_BRANCH"
          git add "$ENTRY_FILE"
          git commit -m "feat: 큐레이션 추가 - $ENTRY_TITLE" -m "#$ISSUE_NUMBER 이슈로 제안된 항목이다."
          git push --force origin "$ENTRY_BRANCH"

          pr_url=$(gh pr list --head "$ENTRY_BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$ENTRY_BRANCH" \
              --title "feat: 큐레이션 추가 - $ENTRY_TITLE" \
              --body "Closes #$ISSUE_NUMBER

          이슈 폼으로 제안된 큐레이션 항목입니다. 파일을 확인하고 머지하면 배포됩니다.")
          else
            gh pr edit "$pr_url" --title "feat: 큐레이션 추가 - $ENTRY_TITLE"
          fi
          printf '\n\n확인 후 머지하면 반영돼요: %s\n' "$pr_url" >> "$COMMENT_FILE"

      - name: Comment result
        if: steps.entry.outputs.status == 'created'
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$COMMENT_FILE"

      - name: Report failure
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ 처리 중에 실패했어요. master에는 아무것도 반영되지 않았어요.

          로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
